name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong' -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
      - run: cp app/build/outputs/apk/debug/app-debug.apk glass-hearts.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: glass-hearts.apk
          generate_release_notes: true
